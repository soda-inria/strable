[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "strable"
dynamic = ["version"]
description = "STRABLE: Benchmarking Tabular Machine Learning with Strings"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
keywords = ["strable", "tabular", "benchmark", "strings"]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Gioia Blayer", email = "gioia.blayer@inria.fr" },
    { name = "Myung Jun Kim" },
    { name = "Félix Lefebvre" },
    { name = "Lennart Purucker" },
    { name = "Alan Arazi" },
    { name = "Eilam Shapira" },
    { name = "Roi Reichart" },
    { name = "Frank Hutter" },
    { name = "Marine Le Morvan" },
    { name = "David Holzmüller" },
    { name = "Gaël Varoquaux" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# The package `strable`: tables, folds, evaluation, Tf-Idf encoder and string taxonomy.
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn>=1.6",
    "skrub>=0.6",
    "huggingface_hub",
]

[project.urls]
Homepage = "https://github.com/soda-inria/strable"
Leaderboard = "https://gblayer.github.io/strable-leaderboard/"
Dataset = "https://huggingface.co/datasets/inria-soda/STRABLE-benchmark"
Paper = "https://arxiv.org/abs/2605.12292"

[project.optional-dependencies]
test = [
    "pytest",
    "coverage",
]
# The paper's experiments (scripts/, src/, figures/ of the repository). The README's setup,
# `pip install -r requirements.txt`, gives the pinned environment. ContextTab (sap-rpt-1-oss) is
# not on PyPI: install it from https://github.com/SAP-samples/sap-rpt-1-oss.
paper = [
    "scipy",
    "joblib",
    "matplotlib",
    "seaborn",
    "statsmodels",
    "scikit-posthocs",
    "xgboost",
    "catboost",
    "tabpfn",
    "tabstar",
    "tarte-ai",
    "fasttext",
    "fastparquet",
    "submitit",
    "torch",
    "transformers",
    "sentence-transformers",
    "pytabkit",
    "networkx",
]
extra = [
    "openml",
    "xmltodict",
]

# Only `strable/` is installed: strable, and its data folders strable/data and strable/data/folds.
[tool.setuptools.packages.find]
include = ["strable", "strable.*"]

[tool.setuptools.package-data]
"strable.data" = ["*.txt", "*.txt.gz"]
"strable.data.folds" = ["*.parquet", "manifest.json"]

[tool.setuptools.dynamic]
version = { attr = "strable.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["network: downloads from Hugging Face (run with `pytest -m network`)"]
addopts = "-m 'not network'"
