# Every day: when the leaderboard (gblayer/strable-leaderboard) has released results newer than the copy the package
# ships, copies them (.github/scripts/leaderboard_results.py), raises the minor version, runs the tests and opens
# one pull request, on the branch leaderboard-results. A newer leaderboard release before the merge updates the same
# pull request. Merging it releases the package (release.yml); the PyPI upload waits for the maintainer's approval.
# Needs the repository setting "Allow GitHub Actions to create and approve pull requests".
name: Leaderboard results

on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: leaderboard-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/leaderboard_results.py >> "$GITHUB_OUTPUT"
      - id: open
        # The pull request of this release is already open: nothing to do until it is merged or a newer one comes.
        if: steps.copy.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Shipped results: leaderboard ${{ steps.copy.outputs.tag }}; version ${{ steps.copy.outputs.version }}"
        run: |
          open=$(gh pr list --head leaderboard-results --state open --json title --jq '.[].title')
          if [ "$open" = "$TITLE" ]; then echo "already open: $TITLE"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
      - name: Test
        if: steps.open.outputs.new == 'true'
        run: |
          python -m pip install ".[test]"
          python -m pytest
      - name: Pull request
        if: steps.open.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.copy.outputs.tag }}
          VERSION: ${{ steps.copy.outputs.version }}
        run: |
          title="Shipped results: leaderboard $TAG; version $VERSION"
          python - > body.md <<'EOF'
          import os, pandas as pd
          df = pd.read_parquet("strable/data/leaderboard/results_per_fold.parquet")
          print(f"The shipped copy of the leaderboard's results follows its release {os.environ['TAG']}: "
                f"{len(df):,} rows, {df['id'].nunique()} pipelines. Version {os.environ['VERSION']}; the tests pass.\n\n"
                "Merging releases the package; the PyPI upload then waits for the maintainer's approval.")
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c leaderboard-results
          git add strable/__init__.py strable/data/leaderboard/
          git commit -m "$title"
          git push --force origin leaderboard-results
          if [ -n "$(gh pr list --head leaderboard-results --state open --json number --jq '.[].number')" ]; then
            gh pr edit leaderboard-results --title "$title" --body-file body.md
          else
            gh pr create --base main --head leaderboard-results --title "$title" --body-file body.md
          fi
